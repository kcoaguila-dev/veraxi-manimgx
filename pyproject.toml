[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veraxi-manimgx"
version = "0.1.0"
description = "Grounded forensic animation pipeline bridging Veraxi GraphRAG with ManimGX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kazuo Coaguila", email = "kcoaguila.dev@gmail.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
animation = [
    "manimgx",
    "kokoro>=0.8.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "espeakng-loader>=0.2.0",
    "phonemizer>=3.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
veraxi-manim = "veraxi_manimgx.cli:main"
